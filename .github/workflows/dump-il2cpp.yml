name: Dump Wrestling Empire IL2CPP
on:
  push:
    paths:
      - '.github/workflows/dump-il2cpp.yml'
      - 'takken 5/global-metadata.dat'
      - 'takken 5/reverse-engineering/extract_arm64_string_xrefs.py'
  workflow_dispatch:
    inputs:
      libil2cpp_url:
        description: "Direct download URL or TransferNow share link for libil2cpp.so"
        required: true
        type: string
        default: "https://www.transfernow.net/dl/20261021AnYkeiDs/bIZha9hd"

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository (metadata file)
        uses: actions/checkout@v4

      - name: Download libil2cpp.so
        env:
          DOWNLOAD_URL: ${{ inputs.libil2cpp_url || 'https://www.transfernow.net/dl/20261021AnYkeiDs/bIZha9hd' }}
        run: |
          set -euo pipefail
          # First try the supplied URL as a direct binary download.
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
            --user-agent "Mozilla/5.0" "$DOWNLOAD_URL" -o libil2cpp.download
          if python3 -c 'from pathlib import Path; import sys; sys.exit(0 if Path("libil2cpp.download").read_bytes()[:4] == b"\x7fELF" else 1)'; then
            mv libil2cpp.download libil2cpp.so
          else
            echo "Share page detected; extracting the TransferNow download-start link."
            python3 - <<'PY'
          import html, json, re
          from pathlib import Path
          s=Path("libil2cpp.download").read_text(errors="ignore")
          m=re.search(r'<a href="([^"]*/d/start\?[^"]*)"', s)
          if not m:
              raise SystemExit("Could not find TransferNow /d/start link in share page.")
          start=html.unescape(m.group(1))
          if start.startswith("/"):
              start="https://www.transfernow.net"+start
          Path("transfernow-start-url.txt").write_text(start)
          print("Found download-start endpoint:", start)
          PY
            START_URL="$(cat transfernow-start-url.txt)"
            curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
              --user-agent "Mozilla/5.0" --referer "$DOWNLOAD_URL" "$START_URL" -o libil2cpp.download
            if ! python3 -c 'from pathlib import Path; import sys; sys.exit(0 if Path("libil2cpp.download").read_bytes()[:4] == b"\x7fELF" else 1)'; then
              echo "TransferNow still returned HTML; trying a real browser download."
              python3 -m pip install --break-system-packages --quiet playwright
              python3 -m playwright install --with-deps chromium
              python3 - <<'PY'
          import asyncio, os, re
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page(accept_downloads=True)
                  await page.goto(os.environ["DOWNLOAD_URL"], wait_until="domcontentloaded", timeout=120000)
                  # TransferNow changes button wording across share-page versions.
                  pattern = re.compile(r"download(\s+(the\s+)?file)?", re.I)
                  candidates = [
                      page.get_by_role("link", name=pattern),
                      page.get_by_role("button", name=pattern),
                  ]
                  chosen = None
                  for candidate in candidates:
                      try:
                          await candidate.first.wait_for(state="visible", timeout=15000)
                          chosen = candidate.first
                          break
                      except Exception:
                          continue
                  if chosen is None:
                      Path("transfernow-page-title.txt").write_text(await page.title())
                      Path("transfernow-page-text.txt").write_text((await page.locator("body").inner_text())[:12000])
                      raise SystemExit("No visible TransferNow download control. Page title/text saved for diagnosis.")
                  async with page.expect_download(timeout=240000) as event:
                      await chosen.click()
                  download = await event.value
                  await download.save_as("libil2cpp.download")
                  await browser.close()
          asyncio.run(main())
          PY
            fi
            python3 - <<'PY'
          from pathlib import Path
          p=Path("libil2cpp.download")
          head=p.read_bytes()[:16]
          if not head.startswith(b"\x7fELF"):
              print("TransferNow browser fallback did not produce an ELF shared library.")
              print("Downloaded bytes:", p.stat().st_size)
              print("First bytes:", repr(head))
              raise SystemExit("Need a direct file URL or libil2cpp.so uploaded to the repository.")
          p.rename("libil2cpp.so")
          print("Verified ELF shared library; bytes:", Path("libil2cpp.so").stat().st_size)
          PY
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libil2cpp.so")
          if not p.exists():
              raise SystemExit("libil2cpp.so was not produced.")
          with p.open("rb") as f:
              head=f.read(16)
          if not head.startswith(b"\x7fELF"):
              raise SystemExit("Final library failed ELF validation.")
          print("Verified ELF shared library; bytes:", p.stat().st_size)
          PY

      - name: Locate metadata
        id: metadata
        run: |
          set -euo pipefail
          META="$(find . -type f -iname 'global-metadata.dat' -not -path './.git/*' -print -quit)"
          if [ -z "$META" ]; then
            echo "global-metadata.dat was not found in the repository checkout."
            exit 1
          fi
          echo "path=$META" >> "$GITHUB_OUTPUT"
          echo "Using metadata: $META"
          ls -lh "$META" libil2cpp.so

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build v39-capable Il2CppDumper fork from source
        run: |
          set -euo pipefail
          # The upstream release path returned HTTP 403, and upstream v6.7.46
          # explicitly rejects metadata version 39. Build the experimental v39
          # fork from source instead of relying on a prebuilt macOS-only asset.
          git clone --depth 1 https://github.com/burhanmoin1/Il2CppDumper-macos.git dumper-src
          dotnet publish dumper-src/Il2CppDumper/Il2CppDumper.csproj \
            --configuration Release \
            --framework net8.0 \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            --output "$GITHUB_WORKSPACE/dumper"
          BIN="$GITHUB_WORKSPACE/dumper/Il2CppDumper"
          if [ ! -f "$BIN" ]; then
            echo "Built Il2CppDumper executable was not found."
            find "$GITHUB_WORKSPACE/dumper" -maxdepth 2 -type f -print
            exit 1
          fi
          chmod +x "$BIN"
          "$BIN" --help || true

      - name: Run Il2CppDumper
        id: dump
        continue-on-error: true
        run: |
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/dumper/Il2CppDumper"
          mkdir -p output
          set +e
          "$BIN" "$GITHUB_WORKSPACE/libil2cpp.so" "$GITHUB_WORKSPACE/${{ steps.metadata.outputs.path }}" "$GITHUB_WORKSPACE/output" > dumper.log 2>&1
          DUMPER_STATUS=$?
          set -e
          cat dumper.log
          echo "exit_code=$DUMPER_STATUS" >> "$GITHUB_OUTPUT"
          if [ -s output/dump.cs ] && [ -s output/script.json ] && [ -s output/il2cpp.h ]; then
            echo "Dump files were generated. The program may crash only during its final Console.ReadKey prompt."
            echo "dump_files_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "Required dump files were not generated."
            echo "dump_files_present=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Disassemble combat candidate ranges (ARM64)
        if: always()
        continue-on-error: true
        run: |
          set -u
          sudo apt-get update -qq
          sudo apt-get install -y llvm
          mkdir -p native-disassembly
          llvm-objdump --version | head -n 2 > native-disassembly/tool-version.txt
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          binary = Path("libil2cpp.so")
          if not binary.is_file():
              matches = list(Path(".").glob("**/libil2cpp.so"))
              if matches:
                  binary = matches[0]
          report = Path("native-disassembly/binary-check.txt")
          if not binary.is_file():
              report.write_text("ERROR: libil2cpp.so not found in runner workspace.\n")
              raise SystemExit(0)
          with binary.open("rb") as f:
              magic = f.read(4)
          if magic != bytes([0x7f, 0x45, 0x4c, 0x46]):
              report.write_text(f"ERROR: file is not ELF; magic={magic!r}; path={binary}\n")
              raise SystemExit(0)
          report.write_text(f"Binary: {binary}\nSize: {binary.stat().st_size}\nELF magic: {magic!r}\n")
          candidates = [
              ("Character_MEKEMKCMCNN", 0x187B054),
              ("Character_DOBMPDMNJBK", 0x187B41C),
              ("Character_CKHMPNPJAJE", 0x187C0F4),
              ("Character_EPNEPBPKCBH", 0x187D5F4),
              ("Character_NEGGBOHACLG", 0x187DD58),
              ("Character_INCNPAABEDN", 0x187DDD8),
              ("Character_OMLNHJGBMOG", 0x187DEB8),
              ("Character_IIOABFAHAGD", 0x187DF20),
              ("Scene_Game_Update", 0x159C578),
              ("Scene_Game_Start", 0x159D7F4),
              # Costume/model pipeline candidates from dump.cs (RVA values):
              ("Costume_PFCOCIOEFBN", 0x1663F6C),
              ("Costume_MFBNABEJFIE", 0x1665040),
              ("Costume_CHCBMJCHBOF", 0x166529C),
              ("Costume_JGEE DIAOKBM".replace(" ", ""), 0x1665AF4),
              ("Costume_JBECIKIBKIP", 0x16662E0),
              ("Costume_ECNCADEADNG", 0x16673A4),
              ("Costume_ACIGFMENHIE", 0x16684B4),
          ]
          for name, address in candidates:
              output = Path("native-disassembly") / f"{name}.txt"
              lo, hi = max(0, address - 128), address + 256
              cmd = ["llvm-objdump", "-d", f"--start-address={lo}", f"--stop-address={hi}", str(binary)]
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
                  body = f"Candidate: {name}\nAddress/RVA: 0x{address:x}\nWindow: 0x{lo:x}..0x{hi:x}\nExit code: {p.returncode}\n\n{p.stdout}\n{p.stderr}"
              except Exception as e:
                  body = f"Candidate: {name}\nAddress/RVA: 0x{address:x}\nERROR: {e}\n"
              output.write_text(body)
          print(report.read_text())
          print("Disassembly report files:", len(list(Path("native-disassembly").glob("*.txt"))))
          PY

      - name: Verify generated dump and summarize
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          out=Path("output")
          report={"files":{}}
          for name in ["dump.cs","script.json","il2cpp.h","stringliteral.json"]:
              p=out/name
              if p.exists():
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  report["files"][name]={"size_bytes":p.stat().st_size,"sha256":h}
          dump=out/"dump.cs"
          if dump.exists():
              s=dump.read_text(errors="ignore")
              report["dump_cs_evidence"]={
                "contains_Character_class":"public class Character" in s,
                "contains_SaveData_class":"class SaveData" in s,
                "contains_moveAttack":"moveAttack" in s,
                "contains_moveGround":"moveGround" in s,
                "contains_ringShape":"ringShape" in s,
                "contains_ringRopes":"ringRopes" in s,
                "RVA_method_count":s.count("// RVA:")
              }
          Path("dump_summary.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - name: Build combat string index
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          p=Path("output/stringliteral.json")
          if not p.exists():
              Path("combat-string-index.txt").write_text("stringliteral.json missing\\n")
              raise SystemExit(0)
          data=json.loads(p.read_text(errors="ignore"))
          rx=re.compile(r"attack|grapple|impact|injur|pinfall|pinning|submission|winner|damage|ground|throw|stun|knock|referee|count|match over|victory", re.I)
          rows=[]
          for item in data:
              val=item.get("value", "")
              if isinstance(val, str) and rx.search(val):
                  rows.append((item.get("address", ""), val.replace("\\n", " ").replace("\\r", " ")))
          rows.sort(key=lambda x: str(x[0]))
          out=[f"Combat-related string candidates: {len(rows)}", "Addresses are the dumper's reported string addresses; they are not yet code XREFs.", ""]
          out += [f"{addr}  {val}" for addr,val in rows]
          Path("combat-string-index.txt").write_text("\\n".join(out)+"\\n", encoding="utf-8")
          print("Indexed combat-related strings:", len(rows))
          PY

      - name: Scan ARM64 string references (experimental XREF)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --quiet pyelftools capstone
          python3 "takken 5/reverse-engineering/extract_arm64_string_xrefs.py" \
            libil2cpp.so output/stringliteral.json output/script.json native-disassembly/string-xrefs.txt

      - name: Upload dump results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrestling-empire-il2cpp-dump
          path: |
            output/
            dumper.log
            dump_summary.json
            native-disassembly/
            combat-string-index.txt
            libil2cpp.so
          if-no-files-found: warn
          retention-days: 14
# Re-trigger native disassembly for combat candidates; source metadata and outputs remain unchanged.
# Refresh trigger: 2026-10-21T22:10Z
