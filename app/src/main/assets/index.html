<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#080d18"><title>X-Men: Field Ops</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;text-shadow:0 2px 4px #000}.panel{background:#081321d9;border:1px solid #9bb1ce55;border-radius:10px;padding:8px 10px;font-size:11px;min-width:130px}.bar{height:7px;background:#29364b;border-radius:9px;margin-top:5px;overflow:hidden}.fill{height:100%;width:100%;background:linear-gradient(90deg,#42d879,#c4f36b)}.controls{position:fixed;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.group{display:flex;gap:7px;pointer-events:auto}.btn{width:clamp(48px,12vw,64px);height:clamp(48px,12vw,62px);border:1px solid #b4c9e477;border-radius:15px;background:#101f34eF;color:white;font-size:13px;font-weight:900;box-shadow:0 3px 0 #0009;touch-action:none;user-select:none}.btn:active,.btn.down{background:#3b5068;transform:translateY(2px)}.btn.hot{border-color:#f6c55f99;background:#50351beF}.btn.power{border-color:#66e6ff99;background:#12384beF}.menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#263e58ee,#04070df7);padding:20px}.card{width:min(440px,100%);padding:23px 20px;border:1px solid #9bb1ce55;border-radius:22px;background:linear-gradient(150deg,#192c43f5,#080f1df5);text-align:center;box-shadow:0 24px 70px #0009}.eyebrow{color:#f6c55f;font-size:11px;font-weight:900;letter-spacing:.18em}.card h1{font-size:clamp(32px,9vw,46px);line-height:.98;margin:12px 0}.card p{font-size:12px;line-height:1.5;color:#c2d0df}.picks{display:flex;gap:7px;margin:16px 0}.picks button{flex:1;padding:12px 2px;border-radius:12px;border:1px solid #7f94ac66;background:#101d2c;color:#dbe7f4;font-size:11px;font-weight:900}.picks button.active{border-color:#f6c55f;background:#3b301e;color:#ffdc8a}.start{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(100deg,#f4bd4c,#ffdf8d);color:#1b1b19;font-weight:1000;font-size:14px}.hide{display:none!important}#notice{position:fixed;top:43%;left:50%;transform:translate(-50%,-50%);padding:12px 16px;border-radius:12px;background:#09121fee;border:1px solid #a6b8d466;font-weight:900;display:none;white-space:nowrap}@media(orientation:portrait){.controls{bottom:20px}.btn{width:48px;height:48px;font-size:11px}.panel{min-width:108px}}
</style></head><body>
<canvas id="game"></canvas><div id="hud" class="hud hide"><div><div style="font-size:11px;color:#f6c55f;font-weight:1000;letter-spacing:.12em">MUTANT FIELD OPS</div><div id="heroLabel" style="font-size:11px;margin-top:4px">WOLVERINE</div></div><div class="panel"><div style="display:flex;justify-content:space-between;gap:18px"><b>HEALTH</b><span id="hpText">100 / 100</span></div><div class="bar"><div id="hp" class="fill"></div></div><div style="display:flex;justify-content:space-between;margin-top:6px;color:#c2d0df"><span id="wave">WAVE 1</span><span id="score">0 PTS</span></div></div></div>
<div id="controls" class="controls hide"><div class="group"><button class="btn" data-k="left">◀</button><button class="btn" data-k="right">▶</button></div><div class="group"><button class="btn" data-k="jump">JUMP</button><button class="btn hot" data-k="attack">HIT</button><button class="btn power" data-k="power">POWER</button></div></div><div id="notice"></div>
<div id="menu" class="menu"><div class="card"><div class="eyebrow">ANDROID PLAYABLE PROTOTYPE</div><h1>X-MEN<br><span style="color:#f6c55f">FIELD OPS</span></h1><p>اختر الشخصية، قاتل روبوتات الحراسة، اجمع النقاط وابقَ على قيد الحياة. تعمل أزرار اللمس ولوحة المفاتيح.</p><div class="picks"><button data-pick="wolverine" class="active">🟡<br>WOLVERINE</button><button data-pick="nightcrawler">🟣<br>NIGHTCRAWLER</button><button data-pick="iceman">🔵<br>ICEMAN</button></div><button id="start" class="start">ابدأ المهمة</button><p style="font-size:10px;color:#8296ac">نسخة تجريبية أصلية؛ ليست نسخة مطابقة للعبة التجارية الأصلية.</p></div></div>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),ctx=c.getContext('2d');let W=0,H=0,D=1,last=0,run=false,elapsed=0,score=0,wave=1,hp=100,selected='wolverine',keys={},enemies=[],particles=[],attackTimer=0,powerTimer=0,noticeTimer=0,player={x:.25,y:0,vy:0,face:1,inv:0};
const heroes={wolverine:{name:'WOLVERINE',body:'#d9a62e',suit:'#19334e',accent:'#ffe18a',speed:.46,damage:32},nightcrawler:{name:'NIGHTCRAWLER',body:'#315bc2',suit:'#25213d',accent:'#b18aff',speed:.55,damage:23},iceman:{name:'ICEMAN',body:'#9be8f3',suit:'#276a91',accent:'#e1ffff',speed:.43,damage:24}};
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;c.width=Math.floor(W*D);c.height=Math.floor(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function say(s){let n=document.querySelector('#notice');n.textContent=s;n.style.display='block';noticeTimer=1.2}
function spawn(n){for(let i=0;i<n;i++)enemies.push({x:.57+Math.random()*.36,y:0,hp:42+wave*5,max:42+wave*5,spd:.07+Math.random()*.04,hit:0,attack:Math.random(),phase:Math.random()*6})}
function reset(){hp=100;score=0;wave=1;elapsed=0;player={x:.25,y:0,vy:0,face:1,inv:0};enemies=[];particles=[];spawn(3);hud()}
function hud(){document.querySelector('#heroLabel').textContent=heroes[selected].name;document.querySelector('#hpText').textContent=Math.ceil(hp)+' / 100';document.querySelector('#hp').style.width=Math.max(0,hp)+'%';document.querySelector('#wave').textContent='WAVE '+wave;document.querySelector('#score').textContent=score+' PTS'}
function pick(id){selected=id;document.querySelectorAll('[data-pick]').forEach(b=>b.classList.toggle('active',b.dataset.pick===id));document.querySelector('#heroLabel').textContent=heroes[id].name}
document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
document.querySelector('#start').addEventListener('click',()=>{document.querySelector('#menu').classList.add('hide');document.querySelector('#hud').classList.remove('hide');document.querySelector('#controls').classList.remove('hide');reset();run=true;last=performance.now();requestAnimationFrame(frame)});
function act(k){if(!run)return;if(k==='jump'&&player.y===0)player.vy=.78;if(k==='attack'&&attackTimer<=0){attackTimer=.32;let hit=0;for(let e of enemies){if(Math.abs(e.x-player.x)<.19&&Math.sign(e.x-player.x)===player.face){e.hp-=heroes[selected].damage;e.hit=.2;hit++;score+=10;if(e.hp<=0){score+=100;for(let j=0;j<8;j++)particles.push({x:e.x,y:.48,vx:(Math.random()-.5)*.7,vy:Math.random()*.6,col:'#ffc95e',life:.6})}}}enemies=enemies.filter(e=>e.hp>0);say(hit?'ضربة ناجحة!':'اقترب من العدو');hud()}if(k==='power'&&powerTimer<=0){powerTimer=1.8;for(let e of enemies){if(Math.abs(e.x-player.x)<.33){e.hp-=selected==='wolverine'?48:38;e.hit=.35}}enemies=enemies.filter(e=>e.hp>0);score+=25;particles.push({x:player.x,y:.55,vx:0,vy:0,col:heroes[selected].accent,life:.45,ring:true});say(selected==='wolverine'?'BERSERKER SLASH':selected==='nightcrawler'?'BLINK STRIKE':'ICE BURST');hud()}}
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;const down=e=>{e.preventDefault();keys[k]=true;b.classList.add('down');if(k==='jump'||k==='attack'||k==='power')act(k)};const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
const keymap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'jump',' ':'jump',z:'attack',j:'attack',x:'power',k:'power'};addEventListener('keydown',e=>{let k=keymap[e.key]||keymap[e.key.toLowerCase()];if(k){e.preventDefault();keys[k]=true;if(k==='jump'||k==='attack'||k==='power')act(k)}});addEventListener('keyup',e=>{let k=keymap[e.key]||keymap[e.key.toLowerCase()];if(k)keys[k]=false});
function roundRect(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawHero(x,y,face,hero,phase,inv){let h=heroes[hero],ground=H*.73,scale=Math.min(W/720,H/440),sz=scale*1.05,px=x*W,py=ground-y*H*.35;ctx.save();ctx.translate(px,py);ctx.scale(face,1);if(inv>0&&Math.floor(elapsed*25)%2)ctx.globalAlpha=.45;ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,3,25*sz,7*sz,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=h.suit;roundRect(-19*sz,-50*sz,38*sz,43*sz,7*sz,h.suit);ctx.fillStyle=h.body;roundRect(-12*sz,-77*sz,24*sz,26*sz,8*sz,h.body);ctx.fillStyle=h.accent;roundRect(1*sz,-68*sz,12*sz,5*sz,2*sz,h.accent);let swing=Math.sin(phase*10)*7*sz;ctx.strokeStyle=h.body;ctx.lineWidth=10*sz;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-13*sz,-45*sz);ctx.lineTo(-19*sz+swing,-22*sz);ctx.moveTo(13*sz,-45*sz);ctx.lineTo(20*sz-swing,-23*sz);ctx.stroke();ctx.strokeStyle='#101a29';ctx.lineWidth=11*sz;ctx.beginPath();ctx.moveTo(-9*sz,-10*sz);ctx.lineTo(-11*sz+swing,-1*sz);ctx.moveTo(9*sz,-10*sz);ctx.lineTo(11*sz-swing,-1*sz);ctx.stroke();if(hero==='wolverine'){ctx.strokeStyle='#f3f6fa';ctx.lineWidth=2*sz;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(18*sz,-30*sz+i*3*sz);ctx.lineTo(29*sz,-42*sz+i*3*sz);ctx.stroke()}}if(hero==='nightcrawler'){ctx.strokeStyle=h.body;ctx.lineWidth=4*sz;ctx.beginPath();ctx.moveTo(-6*sz,-26*sz);ctx.quadraticCurveTo(-27*sz,-10*sz,-22*sz,-2*sz);ctx.stroke()}if(hero==='iceman'){ctx.fillStyle='#bdf7ff88';ctx.beginPath();ctx.arc(0,-44*sz,29*sz,0,Math.PI*2);ctx.fill()}if(attackTimer>0){ctx.strokeStyle=h.accent;ctx.lineWidth=4*sz;ctx.beginPath();ctx.arc(20*sz,-43*sz,25*sz,-1.1,.7);ctx.stroke()}ctx.restore()}
function drawEnemy(e){let px=e.x*W,py=H*.73-e.y*H*.35,sz=Math.min(W/720,H/440)*.95;ctx.save();ctx.translate(px,py);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,3,23*sz,6*sz,0,0,Math.PI*2);ctx.fill();let col=e.hit>0?'#ffbd65':'#53677f';ctx.fillStyle=col;roundRect(-17*sz,-49*sz,34*sz,39*sz,5*sz,col);roundRect(-12*sz,-72*sz,24*sz,23*sz,5*sz,'#36485f');ctx.fillStyle='#ff514b';ctx.fillRect(-8*sz,-63*sz,6*sz,3*sz);ctx.fillRect(3*sz,-63*sz,6*sz,3*sz);ctx.fillStyle='#1a2535';ctx.fillRect(-8*sz,-8*sz,7*sz,8*sz);ctx.fillRect(2*sz,-8*sz,7*sz,8*sz);ctx.fillStyle='#25354a';ctx.fillRect(-18*sz,-46*sz,7*sz,26*sz);ctx.fillRect(11*sz,-46*sz,7*sz,26*sz);ctx.fillStyle='#182334';ctx.fillRect(-22*sz,-82*sz,44*sz,4*sz);ctx.fillStyle='#f65b55';ctx.fillRect(-22*sz,-82*sz,44*sz*(e.hp/e.max),4*sz);ctx.restore()}
function drawWorld(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#091425');sky.addColorStop(.68,'#1a3043');sky.addColorStop(1,'#080d17');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f3c96b';ctx.globalAlpha=.55;ctx.beginPath();ctx.arc(W*.78,H*.18,Math.min(W,H)*.07,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;for(let i=0;i<14;i++){let bw=W/14+2,bh=H*(.13+((i*13)%7)*.035);ctx.fillStyle=i%2?'#101e30':'#14243a';ctx.fillRect(i*bw,H*.56-bh,bw-3,bh);ctx.fillStyle='#d2ad61';for(let yy=H*.58-bh;yy<H*.56;yy+=13)for(let xx=i*bw+8;xx<(i+1)*bw-5;xx+=13)if((xx+yy+i)%3<1)ctx.fillRect(xx,yy,4,5)}ctx.fillStyle='#1b2b3b';ctx.fillRect(0,H*.73,W,H*.27);ctx.fillStyle='#293d50';ctx.fillRect(0,H*.73,W,4);ctx.strokeStyle='#344a5f';ctx.lineWidth=1;for(let i=0;i<18;i++){let xx=i*W/18;ctx.beginPath();ctx.moveTo(xx,H*.74);ctx.lineTo(xx-30,H);ctx.stroke()}ctx.fillStyle='#203449';ctx.fillRect(0,H*.91,W,H*.01)}
function frame(now){if(!run)return;let dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;attackTimer=Math.max(0,attackTimer-dt);powerTimer=Math.max(0,powerTimer-dt);noticeTimer-=dt;if(noticeTimer<=0)document.querySelector('#notice').style.display='none';let dir=(keys.right?1:0)-(keys.left?1:0);if(dir){player.x=Math.max(.04,Math.min(.96,player.x+dir*heroes[selected].speed*dt));player.face=dir}player.vy-=2.0*dt;player.y+=player.vy*dt;if(player.y<0){player.y=0;player.vy=0}player.inv=Math.max(0,player.inv-dt);for(let e of enemies){e.attack-=dt;e.hit=Math.max(0,e.hit-dt);let dx=player.x-e.x;if(Math.abs(dx)>.045)e.x+=Math.sign(dx)*e.spd*dt;else if(e.attack<=0&&player.inv<=0){hp-=8;player.inv=.55;e.attack=.85;hud();if(hp<=0){hp=0;hud();run=false;document.querySelector('#menu').classList.remove('hide');document.querySelector('#start').textContent='إعادة المحاولة';document.querySelector('#menu .card p').textContent='انتهت المهمة. اختر شخصية وحاول مرة أخرى.';return}}}if(enemies.length===0){wave++;spawn(Math.min(3+wave,8));score+=250;say('WAVE '+wave+' · INCOMING');hud()}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=.4*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);drawWorld();let order=[...enemies.map(e=>({x:e.x,type:'e',obj:e})),{x:player.x,type:'p'}].sort((a,b)=>a.x-b.x);for(let o of order)if(o.type==='e')drawEnemy(o.obj);else drawHero(player.x,player.y,player.face,selected,elapsed,player.inv);for(let p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x*W,H*.73-p.y*H*.35,7,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}requestAnimationFrame(frame)}
// expose controls and a lightweight fallback for browsers lacking roundRect
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.rect(x,y,w,h)};
})();
</script></body></html>
