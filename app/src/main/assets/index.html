<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>X-Men Android Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:16px system-ui;overflow:hidden}canvas{width:100vw;height:100vh;display:block;touch-action:none}.hud{position:fixed;top:12px;left:12px;background:#0009;padding:10px;border-radius:10px}.controls{position:fixed;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:8px;pointer-events:auto}button{width:62px;height:58px;border:1px solid #ffffff88;border-radius:14px;background:#263b5b;color:white;font-size:14px;font-weight:bold;touch-action:none}</style></head><body><canvas id="game"></canvas><div class="hud">X-MEN • Android prototype<br><span id="status">Move • Jump • Attack</span></div><div class="controls"><div class="cluster"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="cluster"><button data-key="jump">JUMP</button><button data-key="attack">ATTACK</button><button data-key="power">POWER</button></div></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d');let w,h,t=0;const keys={};let p={x:.28,y:0,v:0,attack:0,power:0};function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;w=c.width;h=c.height;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();document.querySelectorAll('button').forEach(b=>{let k=b.dataset.key;for(let e of ['pointerdown','pointerup','pointercancel','pointerleave'])b.addEventListener(e,ev=>{ev.preventDefault();keys[k]=e==='pointerdown';if(e==='pointerdown'&&k==='attack')p.attack=16;if(e==='pointerdown'&&k==='power')p.power=30})});addEventListener('keydown',e=>{keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key===' '||e.key==='ArrowUp'?'jump':e.key.toLowerCase()==='z'?'attack':e.key.toLowerCase()==='x'?'power':e.key]=true});addEventListener('keyup',e=>{keys[e.key==='ArrowLeft'?'left':e.key==='ArrowRight'?'right':e.key===' '||e.key==='ArrowUp'?'jump':e.key.toLowerCase()==='z'?'attack':e.key.toLowerCase()==='x'?'power':e.key]=false});function frame(){t++;let speed=keys.left?-0.004:keys.right?0.004:0;p.x=Math.max(.08,Math.min(.9,p.x+speed));if(keys.jump&&p.y===0)p.v=.19;p.y+=p.v;p.v-=.009;if(p.y<0){p.y=0;p.v=0}if(p.attack)p.attack--;if(p.power)p.power--;let W=innerWidth,H=innerHeight;x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#182a49');g.addColorStop(1,'#080d18');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#26364a';x.fillRect(0,H*.76,W,H*.24);x.strokeStyle='#4b6685';x.lineWidth=2;for(let i=0;i<10;i++){x.beginPath();x.moveTo(i*W/9,H*.76);x.lineTo(i*W/9-70,H);x.stroke()}const px=p.x*W,py=H*.76-p.y*H*.7;x.fillStyle='#070b13';x.beginPath();x.ellipse(px, H*.76+4,24,8,0,0,Math.PI*2);x.fill();x.fillStyle='#e8bd99';x.beginPath();x.arc(px,py-53,15,0,Math.PI*2);x.fill();x.fillStyle='#f1c40f';x.fillRect(px-15,py-38,30,39);x.fillStyle='#1c2538';x.fillRect(px-13,py+1,10,24);x.fillRect(px+3,py+1,10,24);x.strokeStyle='#e8bd99';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(px-12,py-29);x.lineTo(px-27,py-10);x.moveTo(px+12,py-29);x.lineTo(px+27,py-10);x.stroke();if(p.attack){x.strokeStyle='#e7f3ff';x.lineWidth=5;x.beginPath();x.arc(px+24,py-24,34,-.8,.9);x.stroke()}if(p.power){x.strokeStyle='#5be7ff';x.lineWidth=5;x.beginPath();x.arc(px,py-25,46,0,Math.PI*2);x.stroke()}x.fillStyle='#ff5263';x.fillRect(W*.72,H*.52,38,58);x.fillStyle='#fff';x.font='14px system-ui';x.fillText('Enemy dummy',W*.72-15,H*.49);requestAnimationFrame(frame)}frame();
</script></body></html>
